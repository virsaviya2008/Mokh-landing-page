<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Mobile showcase — virsaviya_web</title>
<!--
  Витрина мобильной версии для Behance, 1920 px в ширину, в стиле серии обложек.
  Картинки берутся из shots/mobile-*.png; список можно поменять параметром ?imgs=a.png,b.png,c.png,d.png
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0b; --pink: #ff4fa3; --text: #f4f1f3; --muted: rgba(244, 241, 243, 0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1240px; background: var(--bg); overflow: hidden; }
  body { position: relative; font-family: 'Manrope', Arial, sans-serif; color: var(--text); }

  .glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 500px at 50% 100%, rgba(255, 79, 163, 0.16), transparent 70%),
      radial-gradient(500px 300px at 0% 0%, rgba(255, 79, 163, 0.07), transparent 70%);
  }

  .head {
    position: absolute;
    top: 90px;
    left: 120px;
    right: 120px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .label { font-size: 16px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--pink); }
  .title { margin-top: 14px; font-family: 'Unbounded', 'Arial Black', sans-serif; font-size: 56px; letter-spacing: -0.02em; }
  .handle { font-size: 18px; font-weight: 700; color: var(--muted); }
  .handle b { color: var(--text); }

  .phones {
    position: absolute;
    top: 300px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 48px;
  }

  .phone {
    width: 360px;
    height: 780px;
    padding: 12px;
    border-radius: 56px;
    background: #1a1a1d;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 40px 90px rgba(0, 0, 0, 0.75);
  }
  .phone:nth-child(even) { transform: translateY(70px); }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: #000;
  }
  .screen img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="glow"></div>

  <div class="head">
    <div>
      <p class="label">Мобильная версия</p>
      <h1 class="title">Адаптив под телефон</h1>
    </div>
    <p class="handle">virsaviya · web &nbsp;·&nbsp; <b>@virsaviya_web</b></p>
  </div>

  <div class="phones" id="phones"></div>

  <script>
    const q = new URLSearchParams(location.search);
    const imgs = (q.get('imgs') || 'shots/mobile-01-hero.png,shots/mobile-03-stages.png,shots/mobile-04-groups.png,shots/mobile-05-pricing.png').split(',');
    document.getElementById('phones').innerHTML = imgs
      .map((src) => `<div class="phone"><div class="screen"><img src="${src}" alt=""></div></div>`)
      .join('');
  </script>
</body>
</html>
